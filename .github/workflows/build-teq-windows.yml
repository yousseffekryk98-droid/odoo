name: Build TEQ Windows EXE
on:
  workflow_dispatch:
  push:
    branches:
      - build/teq-windows-exe
    paths:
      - 'packaging/windows/**'
      - '.github/workflows/build-teq-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out the TEQ source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify launcher code
        shell: pwsh
        run: |
          python -m py_compile packaging/windows/launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'Launcher validation failed.' }
          if (!(Test-Path odoo-bin)) { throw 'odoo-bin missing from checkout.' }
          if (!(Test-Path odoo)) { throw 'odoo Python package missing.' }
          if (!(Test-Path addons)) { throw 'Odoo addons missing.' }

      - name: Build Windows EXE launcher
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install PyInstaller.' }
          python -m PyInstaller --clean --onefile --console --name TEQ-ERP --distpath dist packaging/windows/launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed.' }
          if (!(Test-Path dist/TEQ-ERP.exe)) { throw 'Expected EXE was not created.' }

      - name: Upload Windows launcher EXE separately
        uses: actions/upload-artifact@v4
        with:
          name: TEQ-ERP-Launcher-EXE
          path: dist/TEQ-ERP.exe
          if-no-files-found: error
          retention-days: 30

      - name: Package Odoo source and launcher for offline use
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/TEQ-ERP.exe package/
          Copy-Item packaging/windows/setup-local.ps1 package/
          Copy-Item packaging/windows/WINDOWS_BUILD.md package/
          Copy-Item odoo-bin package/
          Copy-Item requirements.txt package/
          Copy-Item -Recurse odoo package/
          Copy-Item -Recurse addons package/
          if (Test-Path custom_addons) {
            Copy-Item -Recurse custom_addons package/
          }
          Write-Host "Packaged files:"
          Get-ChildItem package | Select-Object Name,Length

      - name: Upload downloadable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TEQ-ERP-Windows
          path: package/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
