name: Build TEQ Windows EXE
on:
  workflow_dispatch:
  push:
    branches:
      - build/teq-windows-exe
    paths:
      - 'packaging/windows/**'
      - '.github/workflows/build-teq-windows.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - name: Check out the TEQ source branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify launcher code
        shell: pwsh
        run: |
          python -m py_compile packaging/windows/launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'Launcher validation failed.' }
          if (!(Test-Path odoo-bin)) { throw 'odoo-bin missing from checkout.' }
          if (!(Test-Path odoo)) { throw 'odoo Python package missing.' }
          if (!(Test-Path addons)) { throw 'Odoo addons missing.' }

      - name: Build Windows EXE launcher
        shell: pwsh
        run: |
          python -m pip install --upgrade pyinstaller
          if ($LASTEXITCODE -ne 0) { throw 'Failed to install PyInstaller.' }
          python -m PyInstaller --clean --onefile --console --name TEQ-ERP --distpath dist packaging/windows/launcher.py
          if ($LASTEXITCODE -ne 0) { throw 'PyInstaller failed.' }
          if (!(Test-Path dist/TEQ-ERP.exe)) { throw 'Expected EXE was not created.' }

      - name: Upload Windows launcher EXE separately
        uses: actions/upload-artifact@v4
        with:
          name: TEQ-ERP-Launcher-EXE
          path: dist/TEQ-ERP.exe
          if-no-files-found: error
          retention-days: 30

      - name: Package Odoo source and launcher for offline use
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item dist/TEQ-ERP.exe package/
          Copy-Item packaging/windows/setup-local.ps1 package/
          Copy-Item packaging/windows/WINDOWS_BUILD.md package/
          Copy-Item odoo-bin package/
          Copy-Item requirements.txt package/
          Copy-Item -Recurse -Force odoo package/
          Copy-Item -Recurse -Force addons package/
          if (Test-Path custom_addons) {
            Copy-Item -Recurse -Force custom_addons package/
          }
          # odoo.upgrade is an intentional namespace package consisting only of
          # .gitkeep in git. Hidden dotfiles and empty dirs can disappear from
          # upload-artifact ZIPs, causing ModuleNotFoundError at startup.
          $upgradeDir = Join-Path 'package' 'odoo/upgrade'
          New-Item -ItemType Directory -Force -Path $upgradeDir | Out-Null
          "Keep this Odoo namespace directory in the downloaded package." | Set-Content -Path (Join-Path $upgradeDir 'README.txt') -Encoding ascii
          Push-Location package
          try {
            python -c "import odoo.upgrade; print('Verified packaged odoo.upgrade namespace')"
            if ($LASTEXITCODE -ne 0) { throw 'Missing odoo.upgrade in Windows package.' }
          } finally {
            Pop-Location
          }
          Write-Host "Packaged files:"
          Get-ChildItem package | Select-Object Name,Length

      - name: Upload downloadable Windows package
        uses: actions/upload-artifact@v4
        with:
          name: TEQ-ERP-Windows
          path: package/
          if-no-files-found: error
          retention-days: 30
          compression-level: 1
